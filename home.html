<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Engine</title>
    <style>
        :root {
            --bg: #f7f9fc;
            --panel: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --accent: #2563eb;
            --accent-dark: #1d4ed8;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(180deg, var(--bg) 0%, #f1f5f9 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .shell {
            width: 100%;
            max-width: 760px;
            padding: 40px 32px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.06);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            color: var(--accent);
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(2rem, 4vw, 2.8rem);
            line-height: 1.1;
            font-weight: 700;
        }

        .subtitle {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 1rem;
        }

        form {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: #fbfdff;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }

        form:focus-within {
            border-color: rgba(37, 99, 235, 0.4);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 1rem;
            color: var(--text);
            padding: 8px 6px 8px 10px;
        }

        .search-btn {
            border: none;
            background: var(--accent);
            color: white;
            padding: 10px 18px;
            border-radius: 999px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .search-btn:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        .footer {
            margin-top: 18px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 18px;
        }

        .chip {
            padding: 7px 12px;
            border-radius: 999px;
            background: #eff6ff;
            color: var(--accent-dark);
            font-size: 0.9rem;
            border: 1px solid #dbeafe;
        }

        @media (max-width: 600px) {
            .shell {
                padding: 28px 20px;
            }

            form {
                flex-direction: column;
                border-radius: 18px;
            }

            .search-input {
                width: 100%;
            }

            .search-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <div class="brand">
            <span class="brand-dot"></span>
            <span>Search Engine</span>
        </div>

        <h1>Find what matters, faster.</h1>
        <p class="subtitle">A clean, focused search experience built for quick answers and effortless exploration.</p>

        <form id="searchForm">
            <input
                id="searchInput"
                class="search-input"
                type="text"
                name="q"
                placeholder="Search the web"
                autocomplete="off"
            >
            <button class="search-btn" type="submit" onclick="search(document.getElementById('searchInput').value)">Search</button>
        </form>

        <div class="chip-row">
            <span class="chip">Fast</span>
            <span class="chip">Simple</span>
            <span class="chip">Modern</span>
        </div>

        <p class="footer">Press Enter or click Search to begin.</p>
    </main>

    <script>
        function search(query) {
            window.location.href = `/search?query=${query.split(" ").join("+")}`;
        }

        function normalizeQuery(value) {
            return value.trim().replace(/\s+/g, ' ');
        }

        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('searchForm');
            const input = document.getElementById('searchInput');

            form.addEventListener('submit', function (event) {
                event.preventDefault();
                const cleanedQuery = normalizeQuery(input.value);
                search(cleanedQuery);
            });
        });
    </script>
</body>
</html>
